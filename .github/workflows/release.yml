name: release

# A version bump merged to main is the release: when src/themes.json names a version
# that has no v<version> tag yet, this checks the tree, builds the release zip, the wheel
# and the sdist, and publishes a GitHub release (the zips and the wheel), which creates the
# tag. ui-theme/update.py installs "latest" from the tag that main's VERSION names, so
# main never points at a tag that does not exist for longer than this job takes.
#
# Publishing to PyPI is opt-in and off until the maintainer turns it on (CONTRIBUTING.md,
# "Publishing to PyPI"): the `pypi` job below runs only for a new release and only when the
# repository variable PYPI_PUBLISH is "true". It uses trusted publishing, so there is no token.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Is this version released?
        id: v
        run: |
          v=$(python -c "import json; print(json.load(open('src/themes.json'))['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then
            echo "v$v is already tagged; nothing to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checks
        if: steps.v.outputs.new == 'true'
        run: |
          python tools/sync_theme.py check
          python tools/check_contrast.py --fail-on any > /dev/null
          python -m unittest discover -s tests
      - name: Build the zip, the wheel and the sdist
        if: steps.v.outputs.new == 'true'
        run: |
          python -m pip install --upgrade build
          python -m build
          python tools/release_zip.py --out dist
          python tools/release_zip.py --notes > notes.md
          printf '\n---\nFor an AI agent: download ThemeForge.zip, unzip it, and have the agent follow AGENTS.md in it (copy its ui-theme/ folder into the app, or run `python3 ThemeForge-%s/ui-theme/update.py --source ThemeForge-%s/ui-theme --dest static/ui-theme`). Always the newest: https://github.com/%s/releases/latest/download/ThemeForge.zip\n' \
            "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.version }}" "${{ github.repository }}" >> notes.md
          ls -l dist
      - name: Tag and publish
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" dist/*.zip dist/*.whl \
            --target "$GITHUB_SHA" --title "ThemeForge ${{ steps.v.outputs.version }}" --notes-file notes.md
      - name: Keep the sdist and the wheel for the PyPI job
        if: steps.v.outputs.new == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  # Opt-in: see CONTRIBUTING.md, "Publishing to PyPI". Trusted publishing (OIDC), so no token is stored.
  pypi:
    needs: release
    if: needs.release.outputs.released == 'true' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
