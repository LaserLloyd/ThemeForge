[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "forgeui"
dynamic = ["version"]
description = "ForgeUI: design tokens, themes, components and a vendoring tool for web UIs (the ThemeForge bundle as a pure-data wheel, standard library only)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["design-tokens", "css", "themes", "dark-mode", "nicegui", "fastapi", "accessibility"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]
# No runtime dependencies. FastAPI/Starlette and NiceGUI are only touched, lazily,
# by forgeui.mount() when the caller passes their app object.
dependencies = []

[project.scripts]
forgeui = "forgeui.__main__:main"

[project.urls]
Homepage = "https://github.com/LaserLloyd/ThemeForge"
Changelog = "https://github.com/LaserLloyd/ThemeForge/blob/main/CHANGELOG.md"

[tool.hatch.version]
# forgeui/_version.py is generated from src/themes.json by tools/sync_theme.py build.
path = "forgeui/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/forgeui",
    "/ui-theme",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["forgeui"]
exclude = ["__pycache__", "*.pyc"]

# The bundle keeps its public path (ui-theme/ at the repository root) and ships
# as package data: forgeui.static_dir() finds it in the wheel and in a checkout.
[tool.hatch.build.targets.wheel.force-include]
"ui-theme" = "forgeui/ui-theme"
