[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# The distribution is "themeforge"; the import package stays "forgeui" (`import forgeui`,
# `python -m forgeui`). The name "forgeui" on PyPI belongs to an unrelated project.
name = "themeforge"
dynamic = ["version"]
description = "ThemeForge: drop-in CSS themes, design tokens, components and icons for web apps, plus the forgeui vendoring tool (pure data, standard library only)"
# README.md has relative links and images that break on PyPI; docs/PYPI.md is the same story with absolute links.
readme = "docs/PYPI.md"
requires-python = ">=3.9"
license = "MIT-0"
license-files = ["LICENSE"]
keywords = ["design-tokens", "css", "themes", "dark-mode", "nicegui", "fastapi", "accessibility"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]
# No runtime dependencies. FastAPI/Starlette and NiceGUI are only touched, lazily,
# by forgeui.mount() when the caller passes their app object.
dependencies = []

[project.scripts]
forgeui = "forgeui.__main__:main"
themeforge = "forgeui.__main__:main"

[project.urls]
Homepage = "https://github.com/LaserLloyd/ThemeForge"
Changelog = "https://github.com/LaserLloyd/ThemeForge/blob/main/CHANGELOG.md"

[tool.hatch.version]
# forgeui/_version.py is generated from src/themes.json by tools/sync_theme.py build.
path = "forgeui/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/forgeui",
    "/ui-theme",
    "/README.md",
    "/docs/PYPI.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["forgeui"]
exclude = ["__pycache__", "*.pyc"]

# The bundle keeps its public path (ui-theme/ at the repository root) and ships
# as package data: forgeui.static_dir() finds it in the wheel and in a checkout.
[tool.hatch.build.targets.wheel.force-include]
"ui-theme" = "forgeui/ui-theme"
