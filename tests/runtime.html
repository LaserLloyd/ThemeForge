<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ui-theme runtime tests</title>
<style>
  /* Harness chrome only; the frames under test carry the themes. */
  body { font: 14px/1.5 system-ui, sans-serif; margin: 20px; }
  .pass::marker { content: "✔ "; }
  .fail { font-weight: 700; }
  .fail::marker { content: "✘ "; }
  /* Frames render off-screen (not display: none), so media queries and
     focus behave as on a real page. */
  iframe { position: absolute; left: -10000px; top: 0; width: 800px; height: 600px; border: 0; }
  code { font-family: ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<h1>ui-theme.js runtime tests</h1>
<p id="summary">running…</p>
<ol id="results"></ol>
<script>
(async function () {
  'use strict';
  // The bundle as an app loads it: ui-theme/ at the repository root.
  const RUNTIME = new URL('../ui-theme/ui-theme.js', location.href).href;
  const CSS = ['ui-theme-base.css', 'ui-components.css', 'ui-theme.css']
    .map((n) => new URL(`../ui-theme/${n}`, location.href).href);
  const CORE = 'purple,midnight-gold,glacier,forest,paper,daylight';
  const results = [];
  const tick = (ms = 30) => new Promise((r) => setTimeout(r, ms));

  function check(name, actual, expected) {
    const ok = JSON.stringify(actual) === JSON.stringify(expected);
    results.push({ name, ok, detail: ok ? '' : `got ${JSON.stringify(actual)}, want ${JSON.stringify(expected)}` });
  }

  function preset(values) {
    for (const [k, v] of Object.entries(values)) {
      if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
    }
  }

  function frame({ attrs = {}, manifest = null, head = '', css = false, sandbox = null, probe = '' }) {
    return new Promise((resolve) => {
      const f = document.createElement('iframe');
      if (sandbox !== null) f.setAttribute('sandbox', sandbox);
      const attrText = Object.entries(attrs).map(([k, v]) => ` ${k}="${v}"`).join('');
      const m = manifest ? `<script>window.UI_THEME_MANIFEST = ${JSON.stringify(manifest)};<\/script>` : '';
      // Transitions off, so a colour read right after a theme switch is the final one.
      const links = css ? CSS.map((h) => `<link rel="stylesheet" href="${h}">`).join('') +
        '<style>*, *::before, *::after { transition: none !important; }</style>' : '';
      f.srcdoc = `<!doctype html><html><head>${head}${m}<script src="${RUNTIME}"${attrText}><\/script>${links}</head>` +
        `<body><select id="p" data-ui-theme-picker></select>${probe}</body></html>`;
      f.addEventListener('load', () => resolve(f), { once: true });
      document.body.appendChild(f);
    });
  }

  const attrsFor = (key, extra = {}) => Object.assign(
    { 'data-themes': CORE, 'data-default': 'glacier', 'data-storage-key': key }, extra);
  const html = (f) => f.contentDocument.documentElement;
  const metaOf = (f, name) => {
    const el = f.contentDocument.querySelector(`meta[name="${name}"]`);
    return el ? el.getAttribute('content') : null;
  };

  // 1. No stored value -> default, attributes, theme-color meta created, nothing written.
  preset({ t1: null });
  const f1 = await frame({ attrs: attrsFor('t1') });
  check('default applied: data-palette', html(f1).getAttribute('data-palette'), 'glacier');
  check('default applied: data-theme (oled -> amoled)', html(f1).getAttribute('data-theme'), 'amoled');
  check('theme-color meta created', metaOf(f1, 'theme-color'), '#000000');
  check('current()', f1.contentWindow.UITheme.current(), 'glacier');
  check('init does not write storage', localStorage.getItem('t1'), null);

  // 2. Stored light theme.
  preset({ t2: 'paper' });
  const f2 = await frame({ attrs: attrsFor('t2') });
  check('stored paper: data-palette', html(f2).getAttribute('data-palette'), 'paper');
  check('stored paper: data-theme', html(f2).getAttribute('data-theme'), 'light');
  check('stored paper: theme-color', metaOf(f2, 'theme-color'), '#e6d2a8');

  // 3. Stored slug the app does not enable -> default.
  preset({ t3: 'laserlloyd' });
  const f3 = await frame({ attrs: attrsFor('t3') });
  check('disabled slug falls back', html(f3).getAttribute('data-palette'), 'glacier');

  // 4. Purple default -> no attribute at all.
  preset({ t4: null });
  const f4 = await frame({ attrs: attrsFor('t4', { 'data-default': 'purple' }) });
  check('purple: no data-palette', html(f4).hasAttribute('data-palette'), false);
  check('purple: data-theme dark', html(f4).getAttribute('data-theme'), 'dark');
  check('purple: theme-color', metaOf(f4, 'theme-color'), '#0e0e1b');

  // 5-7. Manifest config with legacy migration and a mirror attribute.
  const manifest = (key) => ({
    app: 'test', themes: CORE.split(','), default: 'midnight-gold', storageKey: key, families: false,
    legacy: { key: key + '-legacy', map: { 'old-dark': 'midnight-gold', 'old-light': 'purple' } },
    mirrorAttr: 'data-skin', fontsHref: null,
  });
  preset({ t5: null, 't5-legacy': 'old-light' });
  const f5 = await frame({ manifest: manifest('t5') });
  check('legacy old-light -> purple: no data-palette', html(f5).hasAttribute('data-palette'), false);
  check('legacy old-light: mirror attr', html(f5).getAttribute('data-skin'), 'purple');
  check('legacy old-light: new key written', localStorage.getItem('t5'), 'purple');
  check('legacy key kept', localStorage.getItem('t5-legacy'), 'old-light');

  preset({ t6: null, 't6-legacy': 'old-dark' });
  const f6 = await frame({ manifest: manifest('t6') });
  check('legacy old-dark -> midnight-gold', html(f6).getAttribute('data-palette'), 'midnight-gold');
  check('legacy old-dark: new key written', localStorage.getItem('t6'), 'midnight-gold');

  preset({ t7: null, 't7-legacy': 'weird' });
  const f7 = await frame({ manifest: manifest('t7') });
  check('unknown legacy value -> default', html(f7).getAttribute('data-palette'), 'midnight-gold');
  check('unknown legacy value: nothing written', localStorage.getItem('t7'), null);

  preset({ t7b: 'glacier', 't7b-legacy': 'old-light' });
  const f7b = await frame({ manifest: manifest('t7b') });
  check('new key wins over legacy', html(f7b).getAttribute('data-palette'), 'glacier');

  // 8. set(), events, onChange.
  const w1 = f1.contentWindow;
  const seen = [];
  w1.UITheme.onChange((d) => seen.push([d.slug, d.previous]));
  let evented = null;
  f1.contentDocument.addEventListener('ui-theme-change', (e) => { evented = e.detail.slug; });
  check('set returns slug', w1.UITheme.set('daylight'), 'daylight');
  check('set: data-palette', html(f1).getAttribute('data-palette'), 'daylight');
  check('set: data-theme', html(f1).getAttribute('data-theme'), 'light');
  check('set: storage', localStorage.getItem('t1'), 'daylight');
  check('set: theme-color', metaOf(f1, 'theme-color'), '#ffffff');
  check('set: event detail', evented, 'daylight');
  check('set: bogus -> default', w1.UITheme.set('bogus'), 'glacier');
  check('onChange log', seen, [['daylight', 'glacier'], ['glacier', 'daylight']]);
  check('set same theme: no duplicate event', (w1.UITheme.set('glacier'), seen.length), 2);

  // 9. Picker auto-mounted and synced both ways.
  const sel = f1.contentDocument.getElementById('p');
  check('picker options', Array.from(sel.options).map((o) => o.value), CORE.split(','));
  check('picker labels', sel.options[1].textContent, 'Midnight Gold');
  check('picker value follows set()', (w1.UITheme.set('paper'), sel.value), 'paper');
  sel.value = 'forest';
  sel.dispatchEvent(new w1.Event('change'));
  check('picker change -> set', w1.UITheme.current(), 'forest');
  check('picker aria-label', sel.getAttribute('aria-label'), 'Theme');

  // 10. Another document writing the key -> storage event -> repaint.
  localStorage.setItem('t1', 'daylight');
  await tick(80);
  check('cross-tab storage event', html(f1).getAttribute('data-palette'), 'daylight');
  check('cross-tab: picker synced', sel.value, 'daylight');

  // 11. Families.
  preset({ t9: null });
  const f9 = await frame({ attrs: { 'data-themes': 'laserlloyd,laserlloyd-light,purple', 'data-default': 'laserlloyd', 'data-storage-key': 't9', 'data-families': 'true' } });
  const w9 = f9.contentWindow;
  check('partner()', w9.UITheme.partner(), 'laserlloyd-light');
  check('partner(purple) is null', w9.UITheme.partner('purple'), null);
  check('toggleFamily -> light', w9.UITheme.toggleFamily(), 'laserlloyd-light');
  check('toggleFamily: data-theme', html(f9).getAttribute('data-theme'), 'light');
  check('toggleFamily -> dark', w9.UITheme.toggleFamily(), 'laserlloyd');
  check('picker groups opt-in themes', f9.contentDocument.querySelectorAll('#p optgroup').length, 2);
  check('families off: toggle is a no-op', f1.contentWindow.UITheme.toggleFamily(), null);

  // 12. Existing color-scheme meta is kept in step.
  preset({ t11: 'daylight' });
  const f11 = await frame({ attrs: attrsFor('t11'), head: '<meta name="color-scheme" content="dark">' });
  check('color-scheme meta updated', metaOf(f11, 'color-scheme'), 'light');

  // 13. Tokens resolve from the stylesheets.
  preset({ t12: 'paper' });
  const f12 = await frame({ attrs: attrsFor('t12'), css: true });
  await tick(50);
  const w12 = f12.contentWindow;
  check('token(--surface-0) on paper', w12.UITheme.token('--surface-0'), '#e6d2a8');
  check('tokens() accepts bare names', w12.UITheme.tokens(['--accent', 'surface-2']), { '--accent': '#a3241c', 'surface-2': '#efdfb8' });
  w12.UITheme.set('purple');
  check('purple tokens come from :root', w12.UITheme.token('--surface-0'), '#0e0e1b');
  check('color() resolves a token to rgb()', w12.UITheme.color('--surface-0'), 'rgb(14, 14, 27)');
  f12.contentDocument.body.innerHTML = '';
  check('color() survives the body being replaced', w12.UITheme.color('--surface-0'), 'rgb(14, 14, 27)');
  check('colors() resolves color-mix() tokens', /^rgba?\(/.test(w12.UITheme.colors(['--seq-2'])['--seq-2']), true);
  check('theme() metadata', w12.UITheme.theme('glacier').ground, 'oled');
  check('list() is a copy', (w12.UITheme.list()[0].name = 'x', w12.UITheme.list()[0].name), 'Purple');

  // 14. Storage blocked (private mode / blocked site data: the accessor throws)
  //     -> still paints the default, and set() still repaints.
  //     (An opaque-origin sandbox would be the real thing, but the preview
  //     browser refuses its subresource requests, so the accessor is stubbed.)
  const blocker = `<script>Object.defineProperty(window, 'localStorage', { configurable: true, get() { throw new DOMException('blocked', 'SecurityError'); } });<\/script>`;
  preset({ t13: 'paper' });
  const f13 = await frame({ attrs: attrsFor('t13'), head: blocker });
  const w13 = f13.contentWindow;
  check('blocked storage: default painted', [html(f13).getAttribute('data-palette'), html(f13).getAttribute('data-theme'), w13.UITheme.current()], ['glacier', 'amoled', 'glacier']);
  check('blocked storage: set still works', [w13.UITheme.set('forest'), html(f13).getAttribute('data-palette')], ['forest', 'forest']);
  check('blocked storage: real storage untouched', localStorage.getItem('t13'), 'paper');

  // 15. Key cleared in another document -> repaint the default.
  localStorage.setItem('t1', 'paper');
  await tick(80);
  check('cross-tab set before clear', html(f1).getAttribute('data-palette'), 'paper');
  localStorage.removeItem('t1');
  await tick(80);
  check('cross-tab clear -> default', html(f1).getAttribute('data-palette'), 'glacier');

  // 16. onChange unsubscribe.
  const w16 = f1.contentWindow;
  const seen16 = [];
  const off = w16.UITheme.onChange((d) => seen16.push(d.slug));
  w16.UITheme.set('forest');
  off();
  w16.UITheme.set('daylight');
  check('onChange unsubscribe stops delivery', seen16, ['forest']);

  // 17. mountPicker into a container, and the double-mount guard.
  const d1 = f1.contentDocument;
  const host = d1.createElement('div');
  d1.body.appendChild(host);
  const made = w16.UITheme.mountPicker(host, { label: 'Colour theme' });
  check('mountPicker(container) appends a select', [made && made.tagName, host.querySelectorAll('select').length], ['SELECT', 1]);
  check('mountPicker label option', made.getAttribute('aria-label'), 'Colour theme');
  w16.UITheme.mountPicker(made);
  check('remount rebuilds options instead of duplicating them', made.options.length, 6);
  check('remount keeps the mounted guard', made.__uiThemeMounted, true);
  made.value = 'paper';
  made.dispatchEvent(new w16.Event('change'));
  check('remounted picker still drives the theme', html(f1).getAttribute('data-palette'), 'paper');
  w16.UITheme.set('forest');
  check('remounted picker still follows the theme', made.value, 'forest');

  // 18. list() puts a default the picker does not offer first.
  preset({ t18: null });
  const f18 = await frame({ attrs: { 'data-themes': 'glacier,paper', 'data-default': 'purple', 'data-storage-key': 't18' } });
  check('list() prepends a non-offered default', f18.contentWindow.UITheme.list().map((t) => t.slug), ['purple', 'glacier', 'paper']);
  check('non-offered default still paints', html(f18).hasAttribute('data-palette'), false);

  // 19. Legacy value mapped onto a theme this app does not offer: ignored,
  //     nothing stored, default painted.
  preset({ t19: null, 't19-legacy': 'old-dark' });
  const f19 = await frame({ manifest: {
    app: 'test', themes: ['purple', 'glacier'], default: 'glacier', storageKey: 't19', families: false,
    legacy: { key: 't19-legacy', map: { 'old-dark': 'midnight-gold' } }, mirrorAttr: null, fontsHref: null,
  } });
  check('legacy -> disabled theme: default painted', html(f19).getAttribute('data-palette'), 'glacier');
  check('legacy -> disabled theme: nothing stored', localStorage.getItem('t19'), null);

  // 20. data-default="auto": follows the OS colour scheme until a choice is stored.
  preset({ t20: null });
  const f20 = await frame({ attrs: { 'data-themes': CORE, 'data-default': 'auto', 'data-default-dark': 'forest',
                                     'data-default-light': 'paper', 'data-storage-key': 't20' } });
  const w20 = f20.contentWindow;
  const light20 = w20.matchMedia('(prefers-color-scheme: light)').matches;
  check('auto: paints the OS scheme default', w20.UITheme.current(), light20 ? 'paper' : 'forest');
  check('auto: config.auto', w20.UITheme.config.auto, true);
  check('auto: nothing stored', localStorage.getItem('t20'), null);
  const sel20 = f20.contentDocument.getElementById('p');
  check('auto: picker offers Match system first', [sel20.options[0].value, sel20.options[0].textContent], ['', 'Match system']);
  check('auto: picker shows Match system while nothing is stored', sel20.value, '');
  w20.UITheme.set('glacier');
  check('auto: a pick is stored', localStorage.getItem('t20'), 'glacier');
  check('auto: picker shows the pick', sel20.value, 'glacier');
  sel20.value = '';
  sel20.dispatchEvent(new w20.Event('change'));
  check('auto: Match system clears the choice', localStorage.getItem('t20'), null);
  check('auto: Match system repaints the OS default', w20.UITheme.current(), light20 ? 'paper' : 'forest');
  check('auto: picker back on Match system', sel20.value, '');

  // 21. auto without light/dark defaults: the first enabled theme of that kind.
  preset({ t21: null });
  const f21 = await frame({ attrs: { 'data-themes': 'glacier,daylight,paper', 'data-default': 'auto', 'data-storage-key': 't21' } });
  const light21 = f21.contentWindow.matchMedia('(prefers-color-scheme: light)').matches;
  check('auto: first enabled theme of the scheme', f21.contentWindow.UITheme.current(), light21 ? 'daylight' : 'glacier');

  // 22. reset() without auto returns to the fixed default.
  preset({ t22: 'paper' });
  const f22 = await frame({ attrs: attrsFor('t22') });
  check('reset() -> default', f22.contentWindow.UITheme.reset(), 'glacier');
  check('reset() clears storage', localStorage.getItem('t22'), null);
  check('no auto: picker has no Match system option', f22.contentDocument.getElementById('p').options[0].value, 'purple');

  // 23. Components: a checked switch is filled with --selected; a disabled one is not.
  const d12 = f12.contentDocument;
  d12.body.insertAdjacentHTML('beforeend',
    '<input type="checkbox" role="switch" class="ui-switch" id="sw1" checked>' +
    '<input type="checkbox" role="switch" class="ui-switch" id="sw2" checked disabled>' +
    '<input type="checkbox" role="switch" class="ui-switch" id="sw3">' +
    '<span id="probe" style="color: var(--selected)"></span>');
  const cs = (id, prop) => w12.getComputedStyle(d12.getElementById(id))[prop];
  for (const slug of ['purple', 'glacier', 'paper']) {
    w12.UITheme.set(slug);
    check(`${slug}: checked switch is filled with --selected`, cs('sw1', 'backgroundColor'), cs('probe', 'color'));
    check(`${slug}: off switch has no fill`, cs('sw3', 'backgroundColor'), 'rgba(0, 0, 0, 0)');
    check(`${slug}: disabled checked switch has no fill`, cs('sw2', 'backgroundColor'), 'rgba(0, 0, 0, 0)');
    check(`${slug}: disabled switch outline is dashed`, cs('sw2', 'outlineStyle'), 'dashed');
  }

  // 25. Auto mode: storing the theme that is already showing still moves the
  //     picker off "Match system", and reset() moves it back (no slug change).
  preset({ t25: null });
  const f25 = await frame({ attrs: { 'data-themes': CORE, 'data-default': 'auto', 'data-default-dark': 'forest',
                                     'data-default-light': 'paper', 'data-storage-key': 't25' } });
  const w25 = f25.contentWindow, sel25 = f25.contentDocument.getElementById('p');
  const now25 = w25.UITheme.current();
  w25.UITheme.set(now25);
  check('auto: set(current) shows the slug in the picker', sel25.value, now25);
  w25.UITheme.reset();
  check('auto: reset() shows Match system again', sel25.value, '');

  // 26. A manifest may give themes as a comma string.
  preset({ t26: null });
  const f26 = await frame({ manifest: { themes: 'glacier,paper', default: 'paper', storageKey: 't26' } });
  check('manifest with comma-string themes paints', [html(f26).getAttribute('data-palette'),
        f26.contentWindow.UITheme.list().map((t) => t.slug)], ['paper', ['glacier', 'paper']]);

  // 27. localStorage.clear() in another document repaints the default.
  localStorage.setItem('t25', 'glacier');
  await tick(80);
  check('cross-tab set before clear()', html(f25).getAttribute('data-palette'), 'glacier');
  const keep = {};
  for (const k of Object.keys(localStorage)) keep[k] = localStorage.getItem(k);
  localStorage.clear();
  await tick(80);
  check('cross-tab clear() -> default', w25.UITheme.current(), now25);
  for (const [k, v] of Object.entries(keep)) if (k !== 't25') localStorage.setItem(k, v);

  // 28. A picker added after load mounts itself.
  const late = f25.contentDocument.createElement('select');
  late.setAttribute('data-ui-theme-picker', '');
  f25.contentDocument.body.appendChild(late);
  await tick(30);
  check('late picker is filled', late.options.length, 7);

  // 29. ui-components.js and the Quasar adapter load next to the runtime.
  preset({ t29: null });
  const extras = `<script src="${new URL('../ui-theme/ui-components.js', location.href).href}"><\/script>` +
                 `<script src="${new URL('../ui-theme/adapters/quasar.js', location.href).href}"><\/script>`;
  const f29 = await frame({ attrs: attrsFor('t29'), css: true, probe: extras });
  await tick(50);
  const w29 = f29.contentWindow, d29 = f29.contentDocument;
  check('UIComponents API', ['confirm', 'alert', 'prompt', 'toast'].map((k) => typeof w29.UIComponents[k]),
        ['function', 'function', 'function', 'function']);
  w29.UIComponents.toast('Saved <b>x</b>', { kind: 'success', timeout: 0 });
  const toast = d29.querySelector('.ui-toasts .ui-toast--success');
  check('toast shows text, never HTML', [toast && toast.textContent, d29.querySelector('.ui-toast b')], ['Saved <b>x</b>', null]);
  w29.UIComponents.confirm({ title: 'Delete?', message: 'Gone for good.', danger: true });
  const dlg = d29.querySelector('dialog.ui-dialog');
  check('confirm opens a modal dialog', [!!dlg, dlg && dlg.open, dlg && dlg.querySelector('.ui-dialog__title').textContent], [true, true, 'Delete?']);
  check('danger confirm focuses Cancel', d29.activeElement && d29.activeElement.textContent, 'Cancel');
  check('confirm: Cancel then the danger action', Array.from(dlg.querySelectorAll('.ui-dialog__actions button')).map((b) => [b.textContent, b.className]),
        [['Cancel', 'ui-btn'], ['OK', 'ui-btn ui-btn--danger']]);
  check('confirm: labelled by its title', d29.getElementById(dlg.getAttribute('aria-labelledby')).textContent, 'Delete?');
  if (dlg) dlg.remove();
  {
    // Enter that commits an IME composition (Japanese input) must not submit the prompt.
    w29.UIComponents.prompt({ title: 'Name', value: '' });
    const pdlg = d29.querySelector('dialog.ui-dialog');
    const field = pdlg.querySelector('input');
    field.value = 'にほん';
    field.dispatchEvent(new w29.KeyboardEvent('keydown', { key: 'Enter', isComposing: true, bubbles: true, cancelable: true }));
    check('prompt: Enter during IME composition keeps the dialog open', pdlg.open, true);
    field.dispatchEvent(new w29.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
    // (Checked on the dialog itself: under --virtual-time-budget the dialog's close event, which
    // resolves the promise, is sometimes never delivered, and awaiting it hung the whole page.)
    check('prompt: a plain Enter submits as OK', [pdlg.open, pdlg.returnValue, field.value], [false, 'ok', 'にほん']);
    pdlg.remove();
  }

  // 30. Printing: a dark theme prints in a light one, then comes back; nothing is stored.
  preset({ t30: 'glacier' });
  const f30 = await frame({ attrs: attrsFor('t30') });
  const w30 = f30.contentWindow;
  const printEvents = [];
  w30.UITheme.onChange((d) => printEvents.push([d.slug, d.print]));
  w30.dispatchEvent(new w30.Event('beforeprint'));
  check('print: dark theme prints in the first light one', html(f30).getAttribute('data-palette'), 'paper');
  w30.dispatchEvent(new w30.Event('afterprint'));
  check('print: screen theme restored', [html(f30).getAttribute('data-palette'), localStorage.getItem('t30')], ['glacier', 'glacier']);
  check('print: both switches are announced, marked print', printEvents, [['paper', true], ['glacier', true]]);
  preset({ t31: 'glacier' });
  const f31 = await frame({ attrs: attrsFor('t31', { 'data-print-theme': 'none' }) });
  f31.contentWindow.dispatchEvent(new f31.contentWindow.Event('beforeprint'));
  check('print: data-print-theme="none" keeps the theme', html(f31).getAttribute('data-palette'), 'glacier');
  preset({ t32: null });
  const f32 = await frame({ attrs: { 'data-themes': 'laserlloyd,laserlloyd-light', 'data-default': 'laserlloyd', 'data-storage-key': 't32' } });
  f32.contentWindow.dispatchEvent(new f32.contentWindow.Event('beforeprint'));
  check('print: a family prints in its light partner', html(f32).getAttribute('data-palette'), 'laserlloyd-light');

  // 24. The same state rules in every theme, opt-in ones included.
  preset({ t24: null });
  const f24 = await frame({ attrs: { 'data-themes': 'purple,midnight-gold,glacier,forest,paper,daylight,slate,high-contrast,high-contrast-light,electric-yellow,laserlloyd,laserlloyd-light,night-red',
                                     'data-default': 'purple', 'data-storage-key': 't24' }, css: true });
  await tick(50);
  const w24 = f24.contentWindow, d24 = f24.contentDocument;
  d24.body.insertAdjacentHTML('beforeend',
    '<input type="checkbox" class="ui-checkbox" id="cb1" checked>' +
    '<input type="checkbox" class="ui-checkbox" id="cb2" checked disabled>' +
    '<input type="checkbox" role="switch" class="ui-switch" id="s1" checked>' +

    const f = await comp(
      '<div class="ui-progress-row" id="pr"><div class="ui-progress-row__body"><div class="ui-progress-row__head"><span class="ui-progress-row__label" id="pl">Job</span><span class="ui-progress-row__value">42%</span></div>' +
      '<progress class="ui-progress" value="42" max="100" aria-labelledby="pl"></progress></div>' +
      '<button class="ui-btn ui-btn--ghost ui-btn--sm ui-progress-row__cancel" type="button">Cancel</button></div>' +
      '<div class="ui-progress-row" id="pd" data-state="done"><div class="ui-progress-row__body"></div></div>' +
      '<div class="ui-empty" id="em"><h3 class="ui-empty__title">None</h3><p class="ui-empty__desc">Nothing here.</p>' +
      '<div class="ui-empty__actions"><button class="ui-btn ui-btn--primary" id="act1">New</button><button class="ui-btn" id="act2">Import</button></div></div>');
    const w = f.contentWindow, d = f.contentDocument;
    const body = d.querySelector('#pr .ui-progress-row__body'), cancel = d.querySelector('#pr .ui-progress-row__cancel');
    check('progress row: the cancel slot sits after the body', [rect(cancel).left >= rect(body).right - 1, Math.abs(rect(cancel).top + rect(cancel).height / 2 - (rect(body).top + rect(body).height / 2)) < 2], [true, true]);
    check('progress row: a finished row is marked by an edge', w.getComputedStyle(d.getElementById('pd')).borderInlineStartWidth, '3px');
    const acts = d.querySelector('#em .ui-empty__actions');
    check('empty state: actions are a centred row of buttons', [w.getComputedStyle(acts).display, w.getComputedStyle(acts).justifyContent, rect(d.getElementById('act1')).top === rect(d.getElementById('act2')).top], ['flex', 'center', true]);
  }

  // 43j. Icons and the three emoji styles.
  {
    const f = await comp(
      '<p id="ic" style="font-size:20px"></p><div data-palette="high-contrast" id="hc"></div>' +
      '<p id="e1" data-ui-emoji="icon">Saved ✅ then 🎉 → next ↗ <code>⚙️</code></p>' +
      '<p id="e2" data-ui-emoji="text">ok 👍 and ❤️</p><p id="e3" data-ui-emoji="color">yay 🎉</p>' +
      '<div id="e4" data-ui-emoji="icon"><span data-ui-emoji="color">🗑️</span> 🗑️</div>' +
      '<button id="eb" class="ui-btn ui-btn--icon" aria-label="Close">✕</button>');
    const w = f.contentWindow, d = f.contentDocument, U = w.UIComponents;
    check('icons: API', ['icon', 'iconFor', 'icons', 'emojify'].map((k) => typeof U[k]), Array(4).fill('function'));
    check('icons: the set is curated (at most 120) and in display order', [U.icons().length <= 120, U.icons()[0], U.icons().includes('settings')], [true, 'plus', true]);
    const svg = U.icon('trash');
    d.getElementById('ic').append(svg);
    check('icons: icon() is a decorative .ui-icon using the sprite next to the script',
          [svg.getAttribute('class'), svg.getAttribute('aria-hidden'), svg.firstChild.getAttribute('href')],
          ['ui-icon', 'true', new URL('../ui-theme/icons.svg#trash', location.href).href]);
    const named = U.icon('bell', { label: 'Alerts', size: 'sm' });
    check('icons: a label makes it a named image', [named.getAttribute('role'), named.getAttribute('aria-label'), named.getAttribute('class'), named.hasAttribute('aria-hidden')],
          ['img', 'Alerts', 'ui-icon ui-icon--sm', false]);
    check('icons: 1.25em of the text by default', Math.round(rect(svg).width), 25);
    check('icons: the stroke is a theme token, heavier in high contrast',
          [w.getComputedStyle(svg).getPropertyValue('--icon-stroke').trim(), w.getComputedStyle(d.getElementById('hc')).getPropertyValue('--icon-stroke').trim()], ['2', '2.5']);
    check('iconFor: variation selector, skin tone and ZWJ fall back sensibly',
          [U.iconFor('🗑️'), U.iconFor('🗑'), U.iconFor('👍🏽'), U.iconFor('🧑‍💻'), U.iconFor(' ⚙ '), U.iconFor('✕')],
          ['trash', 'trash', 'thumbs-up', 'user', 'settings', 'x']);
    check('iconFor: no icon means null', [U.iconFor('🦄'), U.iconFor('x'), U.iconFor(''), U.iconFor(null)], [null, null, null, null]);
    const e1 = d.getElementById('e1');
    check('emojify icon: a mapped emoji becomes its icon, the emoji stays for copy and screen readers',
          [e1.querySelectorAll('svg.ui-icon').length, e1.querySelector('use').getAttribute('href').split('#')[1], e1.querySelector('.ui-visually-hidden').textContent],
          [1, 'circle-check', '✅']);
    check('emojify icon: an unmapped emoji falls back to text; symbols in a sentence and code stay',
          [e1.querySelector('.ui-emoji').textContent, e1.textContent.includes('→ next ↗'), d.querySelector('#e1 code').textContent],
          ['🎉︎', true, '⚙️']);
    check('emojify text: monochrome text presentation', Array.from(d.querySelectorAll('#e2 .ui-emoji')).map((n) => n.textContent), ['👍︎', '❤︎']);
    check('emojify color: kept, wrapped for the theme filter', d.querySelector('#e3 .ui-emoji--color').textContent, '🎉');
    check('emojify: a nested area keeps its own style',
          [d.querySelectorAll('#e4 .ui-emoji--color').length, d.querySelectorAll('#e4 svg.ui-icon').length], [1, 1]);
    check('emojify: running it again changes nothing', U.emojify(e1, 'icon') + U.emojify(d.getElementById('e2'), 'text'), 0);
    check('emojify: a button that is one mapped symbol gets the icon',
          [U.emojify(d.getElementById('eb')), d.querySelector('#eb use').getAttribute('href').split('#')[1]], [1, 'x']);
    d.getElementById('ic').insertAdjacentHTML('afterend', '<button id="ex" class="ui-btn ui-btn--icon" aria-label="Close">×</button><p id="em">3 × 4</p>');
    check('emojify: a lone × is the close icon, a × in a sum stays a sign',
          [U.emojify(d.getElementById('ex')), U.emojify(d.getElementById('em')), d.getElementById('em').textContent], [1, 0, '3 × 4']);
    const other = `http://localhost:${location.port}/ui-theme/icons.svg`;
    const fx = await comp('', { scriptAttrs: `data-icons="${other}"` });
    check('icons: a sprite on another origin is referenced in the page (it is fetched and inlined)',
          fx.contentWindow.UIComponents.icon('trash').firstChild.getAttribute('href'), '#ui-icon-trash');
    if ('fontVariantEmoji' in d.body.style) {
      check('emoji css: text and colour presentation', [w.getComputedStyle(d.querySelector('#e2 .ui-emoji')).fontVariantEmoji,
            w.getComputedStyle(d.querySelector('#e3 .ui-emoji--color')).fontVariantEmoji], ['text', 'emoji']);
    }
  }

  // 43k. Copy buttons keep their icon (#15); loadLocale calls do not race (#14).
  {
    const SPRITE = new URL('../ui-theme/icons.svg', location.href).href;
    const ICON = `<svg class="ui-icon" aria-hidden="true"><use href="${SPRITE}#copy"/></svg>`;
    const f = await comp(
      `<div class="ui-copy"><code class="ui-copy__value">abc</code><button class="ui-btn ui-btn--icon ui-copy__button" id="ib" type="button">${ICON}</button></div>` +
      `<div class="ui-copy"><code class="ui-copy__value">def</code><button class="ui-btn ui-copy__button" id="tb" type="button">${ICON}Copy</button></div>`);
    const w = f.contentWindow, d = f.contentDocument, U = w.UIComponents;
    Object.defineProperty(w.navigator, 'clipboard', { configurable: true,
      value: { writeText: () => Promise.resolve() } });
    const ib = d.getElementById('ib'), tb = d.getElementById('tb');
    check('copy: an icon-only button keeps its icon and is named Copy',
          [!!ib.querySelector('svg'), ib.textContent.trim(), ib.getAttribute('aria-label')], [true, '', 'Copy']);
    U.setStrings({ copy: 'Kopieren' });
    U.init(d);
    check('copy: the icon-only button is renamed with the table', ib.getAttribute('aria-label'), 'Kopieren');
    U.resetStrings();
    tb.click();
    await tick(60);
    check('copy: feedback swaps the word and keeps the icon', [!!tb.querySelector('svg'), tb.textContent.trim()], [true, 'Copied']);
    ib.click();
    await tick(60);
    check('copy: an icon-only button is marked, not emptied', [!!ib.querySelector('svg'), ib.getAttribute('data-copied')], [true, 'true']);
    await tick(1900);
    check('copy: after the feedback the word and the icon are both back', [!!tb.querySelector('svg'), tb.textContent.trim(), tb.hasAttribute('data-copied')], [true, 'Copy', false]);

    // An icon-only part of a settings row that is not a button: aria-label names nothing on a bare
    // span, so it gets role="img"; a role the app set stays, and a button needs none.
    {
      const g = await comp(
        '<div class="ui-setting" data-level="advanced" data-source="env" data-default="1"><div class="ui-setting__text"><div class="ui-setting__label"><label for="ic">Port</label>' +
        `<span class="ui-badge ui-setting__level" id="il" role="note">${ICON}</span><span class="ui-badge ui-setting__env" id="ie">${ICON}</span></div></div>` +
        `<div class="ui-setting__control"><input class="ui-input" id="ic" value="2"><button class="ui-btn ui-btn--ghost ui-btn--sm ui-setting__reset" id="ir" type="button">${ICON}</button></div></div>`);
      const gd = g.contentDocument;
      const part = (id) => { const n = gd.getElementById(id); return [!!n.querySelector('svg'), n.getAttribute('aria-label'), n.getAttribute('role')]; };
      check('setting: an icon-only badge keeps its icon and is named, with role img', part('ie'), [true, 'Set by environment', 'img']);
      check('setting: a role the app set stays, and a button gets none', [part('il'), part('ir')],
            [[true, 'Advanced', 'note'], [true, 'Reset Port to default', null]]);
      g.contentWindow.UIComponents.setStrings({ setByEnv: 'Par l\u2019environnement' });
      g.contentWindow.UIComponents.init(gd);
      check('setting: the icon-only badge is renamed with the table and keeps its role', part('ie'), [true, 'Par l\u2019environnement', 'img']);
    }

    const late = U.loadLocale('ja');
    await U.loadLocale('en');
    await late;
    check('loadLocale: the newest call wins over a slower earlier one', U.t('cancel'), 'Cancel');
    await U.loadLocale('ja');
    const ja = U.t('copy');
    await U.loadLocale('fr', 'data:application/json,' + encodeURIComponent(JSON.stringify({ cancel: 'Annuler' })));
    check('loadLocale: a new language file drops the words of the previous one', [ja, U.t('cancel'), U.t('copy')], ['コピー', 'Annuler', 'Copy']);
    await U.loadLocale('en');
  }

  // 43h. Pseudo-locale: every built-in word at 2-3x length must not break the layout.
  {
    const accent = { a: 'à', e: 'é', i: 'î', o: 'ö', u: 'ü', A: 'Å', E: 'É', I: 'Î', O: 'Ö', U: 'Û' };
    const pseudo = (s) => '[' + s.replace(/[aeiouAEIOU]/g, (c) => accent[c]) + ' ·ŀöñĝ·ŧèxŧ·ŵôŕd·]';
    const markup = (w) =>
      `<div id="stage" style="width:${w}px;max-width:100%"><div class="ui-settings"><div class="ui-setting" data-level="advanced" data-source="env" data-default="1">` +
      '<div class="ui-setting__text"><div class="ui-setting__label"><label for="ps">Port</label><span class="ui-badge ui-setting__level"></span><span class="ui-badge ui-badge--info ui-setting__env"></span></div>' +
      '<p class="ui-setting__desc">A long description of the setting that wraps over several lines in a narrow column.</p></div>' +
      '<div class="ui-setting__control"><input class="ui-input" id="ps" value="2"><button class="ui-btn ui-btn--ghost ui-btn--sm ui-setting__reset" type="button" hidden></button></div></div>' +
      '<div class="ui-setting" data-default="1"><div class="ui-setting__text"><div class="ui-setting__label"><label for="ps2">Other</label></div></div>' +
      '<div class="ui-setting__control"><input class="ui-input" id="ps2" value="2"><button class="ui-btn ui-btn--ghost ui-btn--sm ui-setting__reset" type="button" hidden></button></div></div></div>' +
      '<div class="ui-copy"><input class="ui-input ui-copy__value" readonly value="http://192.0.2.10:8080/v1" aria-label="URL"><button class="ui-btn ui-copy__button" type="button"></button></div>' +
      '<div class="ui-progress-row"><div class="ui-progress-row__body"><div class="ui-progress-row__head"><span class="ui-progress-row__label">Generating images for the gallery</span><span class="ui-progress-row__value">42%</span></div>' +
      '<progress class="ui-progress" value="42" max="100" aria-label="p"></progress></div><button class="ui-btn ui-btn--ghost ui-btn--sm ui-progress-row__cancel" type="button" data-pseudo="cancel"></button></div>' +
      '<div class="ui-empty"><h3 class="ui-empty__title">No jobs yet</h3><p class="ui-empty__desc">Start one to see it here.</p><div class="ui-empty__actions"><button class="ui-btn ui-btn--primary" type="button" data-pseudo="copy"></button><button class="ui-btn" type="button" data-pseudo="reset"></button></div></div></div>';
    for (const width of [800, 320]) {
      const f = await comp('');
      f.style.width = `${width}px`;  // the viewport itself narrows, so the dialog and toast are measured too
      const w = f.contentWindow, d = f.contentDocument, U = w.UIComponents;
      const words = U.strings();
      const long = {};
      for (const k of Object.keys(words)) long[k] = pseudo(words[k]);
      U.setStrings(long);
      d.body.insertAdjacentHTML('beforeend', markup(width));
      for (const n of d.querySelectorAll('[data-pseudo]')) n.textContent = U.t(n.getAttribute('data-pseudo'));
      U.init(d);
      U.validate(d.getElementById('ps2'), pseudo('Enter a number between one and sixty-five thousand.'), { announce: false });
      const open = U.confirm({ title: pseudo('Delete job?'), message: pseudo('This cannot be undone and the files are gone for good.'), danger: true });
      U.toast(pseudo('Settings saved'), { timeout: 0 });
      await tick(50);
      const bad = [];
      const sels = ['#stage', '.ui-setting', '.ui-setting__control', '.ui-setting__label', '.ui-copy', '.ui-progress-row', '.ui-empty', '.ui-dialog', '.ui-dialog__actions', '.ui-toast', '.ui-btn', '.ui-badge', '.ui-error'];
      for (const sel of sels) {
        for (const n of d.querySelectorAll(sel)) {
          const r = rect(n);
          if (n.scrollWidth > n.clientWidth + 1) bad.push(`${sel} scrolls (${n.scrollWidth}>${n.clientWidth})`);
          if (r.right > w.innerWidth + 0.5 || r.left < -0.5) bad.push(`${sel} outside the viewport`);
          if (!n.closest('dialog, .ui-toasts') && n.id !== 'stage' && r.right > rect(d.getElementById('stage')).right + 0.5) bad.push(`${sel} sticks out of its column`);
        }
      }
      check(`pseudo-locale at ${width}px: nothing overflows`, bad, []);
      check(`pseudo-locale at ${width}px: the page does not scroll sideways`, d.documentElement.scrollWidth <= d.documentElement.clientWidth, true);
      check(`pseudo-locale at ${width}px: the long words are on the page`, [d.querySelector('.ui-copy__button').textContent === long.copy,
            d.querySelector('.ui-setting__reset').textContent === long.reset, d.querySelector('dialog .ui-btn').textContent === long.cancel], [true, true, true]);
      d.querySelector('dialog').remove();
      void open;
    }
  }

  // 43i. Right-to-left smoke test.
  {
    const f = await comp(
      '<div id="stage" style="width:600px">' +
      '<div class="ui-copy"><input class="ui-input ui-copy__value" id="rv" readonly value="http://host/v1" aria-label="URL"><button class="ui-btn ui-copy__button" id="rb" type="button"></button></div>' +
      '<div class="ui-setting" id="rs" data-default="1"><div class="ui-setting__text"><div class="ui-setting__label"><label for="rc">إعداد</label></div></div>' +
      '<div class="ui-setting__control"><input class="ui-input" id="rc" value="2"><button class="ui-btn ui-btn--ghost ui-btn--sm ui-setting__reset" id="rr" type="button" hidden></button></div></div>' +
      '<div class="ui-progress-row" id="rp"><div class="ui-progress-row__body" id="rpb"><progress class="ui-progress" value="3" max="9" aria-label="p"></progress></div><button class="ui-btn ui-progress-row__cancel" id="rpc" type="button">x</button></div>' +
      '<label class="ui-check"><input type="checkbox" role="switch" class="ui-switch" id="rsw" checked> تشغيل</label>' +
      '<div class="ui-codeblock" id="rcb"><div class="ui-codeblock__bar"><span id="rcl">sh</span><button class="ui-codeblock__button" id="rcbtn" type="button"></button></div><pre>echo</pre></div>' +
      '</div>',
      { head: '<script>document.documentElement.lang = "ar"; document.documentElement.dir = "rtl"<\/script>' });
    const w = f.contentWindow, d = f.contentDocument, U = w.UIComponents;
    check('rtl: direction is rtl', w.getComputedStyle(d.body).direction, 'rtl');
    check('rtl: the copy button is at the inline end (visually left)', rect(d.getElementById('rb')).right <= rect(d.getElementById('rv')).left + 1, true);
    check('rtl: the settings text starts on the right, the control follows to its left',
          rect(d.querySelector('#rs .ui-setting__text')).left >= rect(d.getElementById('rc')).right - 1 || rect(d.querySelector('#rs .ui-setting__text')).top < rect(d.getElementById('rc')).top, true);
    check('rtl: the cancel slot is on the left', rect(d.getElementById('rpc')).right <= rect(d.getElementById('rpb')).left + 1, true);
    check('rtl: code block bar puts the button on the left', rect(d.getElementById('rcbtn')).left < rect(d.getElementById('rcl')).left, true);
    check('rtl: a switch is on, with its knob toward the inline end', w.getComputedStyle(d.getElementById('rsw')).backgroundColor !== 'rgba(0, 0, 0, 0)', true);
    U.toast('تم الحفظ', { timeout: 0 });
    check('rtl: toasts stack at the inline end (visually left)', rect(d.querySelector('.ui-toast')).left < w.innerWidth / 2, true);
    d.getElementById('rc').value = '9';
    d.getElementById('rc').dispatchEvent(new w.Event('input', { bubbles: true }));
    check('rtl: reset shows and nothing overflows', [d.getElementById('rr').hidden, d.documentElement.scrollWidth <= d.documentElement.clientWidth], [false, true]);
    U.confirm({ title: 'حذف؟', message: 'لا يمكن التراجع.', danger: true });
    const dlg = d.querySelector('dialog.ui-dialog');
    const btns = Array.from(dlg.querySelectorAll('.ui-dialog__actions button'));
    check('rtl: dialog actions run right to left (OK is the leftmost last)', rect(btns[0]).left > rect(btns[1]).left, true);
    dlg.remove();
    // Joined script: tracking would pull each word apart, so Arabic sets every tracked role solid.
    d.getElementById('stage').insertAdjacentHTML('beforeend', '<h1 id="rh">عنوان</h1><div class="ui-kicker" id="rk">الحالة</div>');
    check('rtl: Arabic headings and kickers are not tracked',
          ['rh', 'rk'].map((id) => parseFloat(w.getComputedStyle(d.getElementById(id)).letterSpacing) || 0), [0, 0]);
    d.getElementById('stage').insertAdjacentHTML('beforeend', '<table class="ui-table"><thead><tr><th id="rth">عنوان</th><th><button class="ui-table__sort" id="rsb" type="button">عنوان</button></th></tr></thead></table>');
    check('rtl: an Arabic sortable header is not tracked either (the button follows the header)',
          ['rth', 'rsb'].map((id) => parseFloat(w.getComputedStyle(d.getElementById(id)).letterSpacing) || 0), [0, 0]);
  }

  // 43l. Sortable table headers: the button, the icon and the sorted and numeric states.
  {
    const SPRITE = new URL('../ui-theme/icons.svg', location.href).href;
    const SORT = (name) => `<svg class="ui-icon ui-table__sort-icon" aria-hidden="true"><use href="${SPRITE}#${name}"/></svg>`;
    const f = await comp(
      '<div class="ui-table-wrap"><table class="ui-table"><thead><tr>' +
      // The header's own weight and colour are set away from the rules, so a passing check
      // shows the rule at work and not an inherited value.
      `<th id="hs" aria-sort="ascending" style="font-weight: 400"><button class="ui-table__sort" id="bs" type="button">Minutes${SORT('arrow-up')}</button></th>` +
      `<th id="hu" aria-sort="none" style="color: var(--text-primary)"><button class="ui-table__sort" id="bu" type="button">Job${SORT('arrow-up-down')}</button></th>` +
      `<th id="hn" class="num" aria-sort="descending"><button class="ui-table__sort" id="bn" type="button">Total${SORT('arrow-down')}</button></th>` +
      '<th id="hp">Owner</th>' +
      '</tr></thead><tbody><tr><td>render</td><td class="num">12.4</td></tr></tbody></table></div>' +
      '<table class="ui-table"><thead><tr><th id="hq">Owner</th></tr></thead></table>' +
      '<span id="tt" style="color: var(--text-tertiary)">quiet</span><span id="tp" style="color: var(--text-primary)">loud</span>');
    const w = f.contentWindow, d = f.contentDocument;
    const cs = (el) => w.getComputedStyle(el);
    const bs = d.getElementById('bs'), bu = d.getElementById('bu'), bn = d.getElementById('bn');
    const iu = d.querySelector('#hu svg'), hn = d.getElementById('hn');
    check('sort: a sorted header is a semibold button in primary text',
          [cs(bs).fontWeight, cs(bn).fontWeight, cs(bs).color === cs(d.getElementById('tp')).color], ['600', '600', true]);
    check('sort: an unsorted header keeps its icon in tertiary text',
          cs(iu).color === cs(d.getElementById('tt')).color, true);
    check('sort: the button is a reset control (no border, transparent, pointer, inline flex)',
          [cs(bu).backgroundColor, cs(bu).borderTopWidth, cs(bu).cursor, cs(bu).display], ['rgba(0, 0, 0, 0)', '0px', 'pointer', 'inline-flex']);
    check('sort: the icon is 1em, the size of the label text', Math.abs(rect(iu).width - parseFloat(cs(iu).fontSize)) < 0.5, true);
    check('sort: a numeric header fills its cell and the label sits at the end',
          [cs(bn).justifyContent, Math.abs(rect(bn).right - (rect(hn).right - parseFloat(cs(hn).paddingRight))) < 1], ['flex-end', true]);
    // A button resets text-transform and letter-spacing; the header's plain cells set the label in
    // capitals and tracked, so the button has to match the plain header beside it.
    const hp = d.getElementById('hp');
    check('sort: a sortable header is set like a plain header in the same row (capitals, tracking)',
          [cs(hp).textTransform, cs(bu).textTransform, cs(hp).letterSpacing !== 'normal', cs(bu).letterSpacing === cs(hp).letterSpacing],
          ['uppercase', 'uppercase', true, true]);
    check('sort: the button is at least a 24px target tall', [bs, bu, bn].map((b) => rect(b).height >= 24), [true, true, true]);
    check('sort: the target does not make the header row taller than plain headers',
          Math.abs(rect(hp).height - rect(d.getElementById('hq')).height) < 1, true);
  }

  // Report.
  const list = document.getElementById('results');
  for (const r of results) {
    const li = document.createElement('li');
    li.className = r.ok ? 'pass' : 'fail';
    li.textContent = r.name + (r.detail ? ' — ' + r.detail : '');
    list.appendChild(li);
  }
  const failed = results.filter((r) => !r.ok).length;
  const text = `${results.length - failed}/${results.length} passed` + (failed ? `, ${failed} FAILED` : '');
  document.getElementById('summary').textContent = text;
  document.title = (failed ? 'FAIL ' : 'PASS ') + text;
  for (const k of Object.keys(localStorage)) if (/^t\d+b?(-legacy)?$/.test(k)) localStorage.removeItem(k);
})().catch((e) => {
  document.getElementById('summary').textContent = 'harness error: ' + e;
  document.title = 'ERROR';
});
</script>
</body>
</html>
